<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ojo de Halcón: Encuentra el color diferente</title>
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👁️</text></svg>">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent: #38bdf8;
            --danger: #ef4444;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .game-container {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            color: var(--accent);
        }

        .stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            font-size: 1rem;
            font-weight: bold;
        }

        #grid {
            display: grid;
            gap: 6px;
            margin-bottom: 1.5rem;
            justify-content: center;
            max-width: 400px; 
            margin-left: auto;
            margin-right: auto;
        }

        .cell {
            aspect-ratio: 1;
            border-radius: 4px;
            cursor: pointer;
            transition: transform 0.1s ease, box-shadow 0.2s ease;
        }

        .cell:hover {
            transform: scale(1.05);
            box-shadow: 0 0 10px rgba(255,255,255,0.3);
        }

        .cell:active {
            transform: scale(0.95);
        }

        .cell.wrong {
            animation: shake 0.3s;
            background-color: var(--danger) !important;
        }

        .btn {
            background-color: var(--accent);
            color: var(--bg-color);
            border: none;
            padding: 0.75rem 2rem;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px); }
            50% { transform: translate(-1px, -1px); }
            100% { transform: translate(1px, -1px); }
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>🦅 Ojo de Halcón</h1>
        <div class="stats">
            <span id="level-text">Nivel: 1</span>
            <span id="score-text">Puntos: 0</span>
            <span id="lives-text">Vidas: ❤️❤️❤️</span>
        </div>
        
        <div id="grid"></div>

        <button id="start-btn" class="btn" onclick="initGame()">Comenzar Juego</button>
    </div>

    <script>
        let level = 1;
        let score = 0;
        let lives = 3;
        let isPlaying = false;

        const gridElement = document.getElementById('grid');
        const levelText = document.getElementById('level-text');
        const scoreText = document.getElementById('score-text');
        const livesText = document.getElementById('lives-text');
        const startBtn = document.getElementById('start-btn');

        function initGame() {
            level = 1;
            score = 0;
            lives = 3;
            isPlaying = true;
            startBtn.style.display = 'none';
            renderLevel();
        }

        function renderLevel() {
            if (!isPlaying) return;

            levelText.textContent = `Nivel: ${level}`;
            scoreText.textContent = `Puntos: ${score}`;
            livesText.textContent = `Vidas: ${'❤️'.repeat(lives)}`;

            let gridSize;
            if (level < 20) {
                gridSize = Math.min(2 + Math.floor(level / 4), 6);
            } else {
                gridSize = Math.min(6 + Math.floor((level - 20) / 5), 8);
            }
            
            const totalCells = gridSize * gridSize;
            
            gridElement.innerHTML = '';
            gridElement.style.gridTemplateColumns = `repeat(${gridSize}, 1fr)`;

            const r = Math.floor(Math.random() * 200);
            const g = Math.floor(Math.random() * 200);
            const b = Math.floor(Math.random() * 200);
            const baseColor = `rgb(${r}, ${g}, ${b})`;

            let diff;
            if (level < 20) {
                diff = Math.max(15, 80 - (level * 3));
            } else {
                const hardDiffDrop = (level - 20) * 0.15;
                diff = Math.max(1, Math.floor(12 - hardDiffDrop));
            }

            const channelToChange = Math.floor(Math.random() * 3);
            let tr = r, tg = g, tb = b;

            if (channelToChange === 0) tr = Math.min(255, r + diff);
            else if (channelToChange === 1) tg = Math.min(255, g + diff);
            else tb = Math.min(255, b + diff);

            const targetColor = `rgb(${tr}, ${tg}, ${tb})`;
            const winningIndex = Math.floor(Math.random() * totalCells);

            for (let i = 0; i < totalCells; i++) {
                const cell = document.createElement('div');
                cell.classList.add('cell');
                
                if (i === winningIndex) {
                    cell.style.backgroundColor = targetColor;
                    cell.dataset.winning = "true"; 
                } else {
                    cell.style.backgroundColor = baseColor;
                }

                cell.addEventListener('click', handleCellClick);
                gridElement.appendChild(cell);
            }
        }

        function handleCellClick(e) {
            if (!isPlaying) return;

            const clickedCell = e.target;

            if (clickedCell.dataset.winning === "true") {
                score += 100 * level; 
                level++;
                renderLevel();
            } else {
                lives--;
                clickedCell.classList.add('wrong');
                
                if (lives <= 0) {
                    gameOver();
                } else {
                    livesText.textContent = `Vidas: ${'❤️'.repeat(lives)}`;
                    gridElement.style.pointerEvents = 'none';
                    setTimeout(() => {
                        gridElement.style.pointerEvents = 'auto';
                        clickedCell.classList.remove('wrong');
                    }, 300);
                }
            }
        }

        function gameOver() {
            isPlaying = false;
            gridElement.innerHTML = `
                <div style="grid-column: 1 / -1; text-align: center; padding: 20px;">
                    <h2 style="color: var(--danger); font-size: 2rem;">¡Game Over!</h2>
                    <p style="font-size: 1.2rem;">Has alcanzado el Nivel ${level}</p>
                    <p style="font-size: 1.2rem;">Puntuación final: ${score}</p>
                </div>
            `;
            startBtn.style.display = 'inline-block';
            startBtn.textContent = 'Jugar de nuevo';
        }
    </script>
</body>
</html>
